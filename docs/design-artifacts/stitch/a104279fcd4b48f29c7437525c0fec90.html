<!-- Lightweight Inline JS for transcript toggle interactivity -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('transcript-toggle-btn');
      const transcriptPanel = document.getElementById('flow-transcript-panel');

      if (toggleBtn && transcriptPanel) {
        toggleBtn.addEventListener('click', () => {
          const isHidden = transcriptPanel.classList.toggle('hidden');
          toggleBtn.textContent = isHidden ? '[Show text transcript]' : '[Hide text transcript]';
          toggleBtn.setAttribute('aria-expanded', !isHidden);
        });
      }
    });
  </script>
